services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: opsflow
      POSTGRES_USER: opsflow
      POSTGRES_PASSWORD: opsflow_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - opsflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsflow -d opsflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opsflow_postgres:
